name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:compression

  # The integration suite is the only executable specification of the server
  # behavior in this repo, and until PR #21 it ran by hand. That is how a flaky
  # test survived unnoticed and how bookmarks.integration.test.ts drifted into
  # testing Postgres instead of the bookmark path. It takes about two minutes.
  integration:
    uses: ./.github/workflows/stack-suite.yml
    with:
      script: test:integration

  # The smoke suite is the browser-level guard on the handful of flows the app
  # exists for: render a public page for an anonymous visitor, sign in, propose
  # and publish a project, request and return an item, and stay out of pages you
  # are not allowed into. That is one per `@smoke` describe in `src/test/e2e/`,
  # and the list is worth keeping in step: AGENTS.md sends a reader here to
  # decide whether a change needs the suite run locally. It runs against the
  # production build, which the dev server cannot stand in for, so its
  # playwright config builds and starts .output rather than `vite dev`. Chromium
  # only, serial, inside a 5-minute job. Anything larger or flakier than that
  # belongs to the full suite in #143, which is dispatch-only.
  #
  # Required. It is registered on the `main` ruleset as `smoke / suite`, not
  # `smoke`: a `workflow_call` reference renders a check as
  # `<caller job> / <called job>`, and the bare name would never resolve, which
  # blocks every pull request indefinitely rather than failing loudly.
  smoke:
    uses: ./.github/workflows/stack-suite.yml
    with:
      script: test:smoke
      seed: true
      browser: true
      report-path: playwright-report/e2e
      report-name: smoke-report

  # The accessibility scans tagged `@smoke`: every public page, the two admin
  # data tables, and the /my/items tab panels, each in light and dark. The
  # full suite scans a hundred pages and took four minutes on a runner, so it
  # moved to full-accessibility.yml, dispatch-only, on 2026-09-02; this subset
  # is what stays on the pull-request path. It needs a dev seed on top of the
  # shared stack, because global-setup.ts signs in as the seeded users to
  # capture their storage state.
  #
  # Advisory until it is registered. The check to add to the `main` ruleset
  # is `accessibility-smoke / suite`, for the same `<caller job> / <called job>`
  # reason as smoke above. Register it after this job has reported on a pull
  # request, which the ruleset picker needs before it offers the name.
  accessibility-smoke:
    uses: ./.github/workflows/stack-suite.yml
    with:
      script: test:accessibility:smoke
      seed: true
      browser: true
      report-path: playwright-report/a11y
      report-name: a11y-smoke-report
