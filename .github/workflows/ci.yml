name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:compression

  # The integration suite is the only executable specification of the server
  # behavior in this repo, and until PR #21 it ran by hand. That is how a flaky
  # test survived unnoticed and how bookmarks.integration.test.ts drifted into
  # testing Postgres instead of the bookmark path. It takes about two minutes.
  integration:
    uses: ./.github/workflows/stack-suite.yml
    with:
      script: test:integration

  # The smoke suite is the browser-level guard on the handful of flows the app
  # exists for: sign in, propose and publish a project, request and return an
  # item, and stay out of pages you are not allowed into. It runs against the
  # production build, which the dev server cannot stand in for, so its
  # playwright config builds and starts .output rather than `vite dev`. Chromium
  # only, serial, inside a 5-minute job. Anything larger or flakier than that
  # belongs to the full suite in #143, which is dispatch-only.
  #
  # Advisory for now. It joins the required status checks once it has a known
  # flake rate, and the check to register there is `smoke / suite`, not `smoke`.
  smoke:
    uses: ./.github/workflows/stack-suite.yml
    with:
      script: test:smoke
      seed: true
      browser: true
      report-path: playwright-report/e2e
      report-name: smoke-report

  # The a11y suite has existed since 2026-05-26 and did not run in CI until
  # PR #62, so an accessibility regression could reach main unnoticed.
  # `npm test` excludes it on purpose to keep the unit run fast; this is the
  # other half of that trade. It needs a dev seed on top of the shared stack,
  # because global-setup.ts signs in as the seeded users to capture their
  # storage state.
  accessibility:
    uses: ./.github/workflows/stack-suite.yml
    with:
      script: test:accessibility
      seed: true
      browser: true
      report-path: playwright-report/a11y
      report-name: a11y-report
