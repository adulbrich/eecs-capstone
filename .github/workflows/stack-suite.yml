# One job definition for every suite that needs the full stack: a pgvector
# Postgres, RustFS object storage, migrations and a bucket. `integration` and
# `accessibility` each carried their own copy of all of that, so bumping the
# Postgres image or fixing the storage wait loop meant editing the same lines
# twice and noticing when they drifted. A composite action could not fix it:
# composite actions declare `steps` but not `services`, and the services block
# is the largest duplicated part. A reusable workflow contributes whole jobs,
# so it can carry both.
#
# The cost of `workflow_call` is that a check is named `<caller> / suite` rather
# than `<caller>`, which matters only for the required-status-checks ruleset.
name: Stack suite

on:
  workflow_call:
    inputs:
      script:
        description: >-
          Name of the npm script that runs the suite, as in `test:integration`.
          A bare name rather than a command line, so the run step can quote it.
        required: true
        type: string
      seed:
        description: >-
          Run `npm run db:seed:dev` first. A Playwright suite needs it when
          its global setup signs in as the seeded users; the integration suite
          builds its own rows and does not.
        type: boolean
        default: false
      browser:
        description: Install chromium. Only the Playwright suites need it.
        type: boolean
        default: false
      report-path:
        description: >-
          Playwright report directory to upload when the suite fails. Empty
          means the suite produces no report worth keeping.
        type: string
        default: ""
      report-name:
        description: Artifact name for the uploaded report.
        type: string
        default: report

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      # pgvector, not plain postgres: projects carry an embedding column.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eecs_capstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # uploads.integration.test.ts writes to a bucket and reads the object
      # back, so the suite needs object storage as well as a database.
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci

      # drizzle-kit, storage-init and vitest.integration.config.ts all read
      # .env.local, so CI writes one rather than each learning a new source.
      - name: Write .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/eecs_capstone
          BETTER_AUTH_SECRET=ci-not-a-real-secret
          BETTER_AUTH_URL=http://localhost:3000
          S3_ENDPOINT=http://localhost:9000
          S3_REGION=us-east-1
          S3_BUCKET=cs-capstone
          S3_ACCESS_KEY=rustfsadmin
          S3_SECRET_KEY=rustfsadmin
          VITE_STORAGE_PUBLIC_BASE=http://localhost:9000/cs-capstone
          EOF

      - name: Wait for object storage
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:9000 \
              || [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000)" != "000" ]; then
              echo "storage responding"; exit 0
            fi
            sleep 2
          done
          echo "storage did not come up"; exit 1

      - run: npm run db:migrate
      - run: npm run storage:init

      # The a11y global setup fails with an explicit "run npm run db:seed:dev"
      # message if these users are missing, so the seed is a hard prerequisite
      # for any suite that signs in as them.
      - if: inputs.seed
        run: npm run db:seed:dev

      # Key the browser cache on the version npm actually installed, not the
      # range in package.json: a Dependabot bump that only moves the range
      # would otherwise restore the old binary under a key that still matches.
      - if: inputs.browser
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - if: inputs.browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # `--with-deps` runs every time even on a cache hit. The browser binary is
      # the large, cacheable part; the apt step is quick, and skipping it is how
      # a runner image bump produces a missing shared library that nobody
      # connects back to the cache.
      - if: inputs.browser
        run: npx playwright install --with-deps chromium

      # Through `env` and quoted, rather than interpolated into the `run` line.
      # Only in-repo callers can reach a `./` workflow_call reference, so the
      # interpolation was injection-shaped rather than exploitable, but taking
      # a script name instead of a command line removes the shape entirely and
      # lets the expansion be quoted.
      - env:
          SUITE_SCRIPT: ${{ inputs.script }}
        run: npm run "$SUITE_SCRIPT"

      - if: failure() && inputs.report-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.report-name }}
          path: ${{ inputs.report-path }}
          retention-days: 7
