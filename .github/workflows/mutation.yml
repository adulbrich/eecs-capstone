# Mutation testing with Stryker over the modules `stryker.config.mjs` names
# (#843). Advisory: a low score never fails the run, because the config sets
# no `break` threshold, and nothing here is a required check.
#
# `workflow_dispatch` only, like `full-e2e.yml`. It needs no database or
# browser, so it is a plain job rather than a `stack-suite.yml` caller. The
# result is the HTML report it uploads; the job log carries the same table in
# text.
name: Mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    # A hang catcher, not a budget: the run takes about a minute locally.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 7
