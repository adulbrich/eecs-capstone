version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current via reviewed PRs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # npm, grouped. Every PR goes through the review loop in AGENTS.md, so a few
  # larger bumps cost less than many small ones. TanStack moves together and
  # is what docs/QUIRKS.md most often records a change against, so it gets its
  # own group and its own review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # better-auth 1.7 moves the ONID callback path; UIT has to allowlist the
      # new redirect URI first (#278, docs/QUIRKS.md). Stay on the 1.6 line.
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # react-table 9 replaces the row-model API that admin-data-table.tsx is
      # built on; it is a migration, not a bump (#313).
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/match-sorter-utils"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 ships no compiler API yet, and the server-function scanner
      # test needs one (#316).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node major in .nvmrc, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      all-other:
        patterns:
          - "*"
        exclude-patterns:
          - "@tanstack/*"
