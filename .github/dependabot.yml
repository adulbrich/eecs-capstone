version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current via reviewed PRs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # npm, grouped. Every PR goes through the review loop in AGENTS.md, so a few
  # larger bumps cost less than many small ones. TanStack moves together and
  # is what docs/QUIRKS.md most often records a change against, so it gets its
  # own group and its own review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # better-auth and @better-auth/core are not ignored and must stay that
      # way as a pair: better-auth pins its core to the same exact version, so
      # ignoring one strands a second copy on another line and breaks the
      # build (#599). Both fall in `all-other`, so they arrive in one PR. A
      # minor can move the ONID callback, which UIT must allowlist first
      # (#278, docs/QUIRKS.md); onid-sign-in.test.ts fails if it does.

      # Biome 2.5.14 types RegExp exec() as never null, so
      # noUnnecessaryConditions flags every match guard (#599).
      - dependency-name: "@biomejs/biome"
        versions: ["2.5.14"]
      # TypeScript 7 ships no compiler API yet, and the server-function scanner
      # test needs one (#316).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node major in .nvmrc, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      all-other:
        patterns:
          - "*"
        exclude-patterns:
          - "@tanstack/*"
