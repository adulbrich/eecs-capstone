version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current via reviewed PRs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # npm, grouped. Every PR goes through the review loop in AGENTS.md, so a few
  # larger bumps cost less than many small ones. TanStack moves together and
  # is what docs/QUIRKS.md most often records a change against, so it gets its
  # own group and its own review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      all-other:
        patterns:
          - "*"
        exclude-patterns:
          - "@tanstack/*"
